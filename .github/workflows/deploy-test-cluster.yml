name: Deploy Test Cluster

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-test-cluster
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  AWS_CIO_INSTANCE_ID: ${{ vars.AWS_CIO_INSTANCE_ID }}
  AWS_MD_INSTANCE_ID: ${{ vars.AWS_MD_INSTANCE_ID }}

jobs:
  validate:
    name: Validate Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test -- --run

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test adapter package
        run: python -m unittest discover deploy/agent_2_dashboard_adapter -p "test_*.py"

  deploy-md:
    name: Deploy md
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy adapter to md via SSM
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AWS_MD_INSTANCE_ID}" ]]; then
            echo "AWS_MD_INSTANCE_ID repository variable is required."
            exit 1
          fi

          if [[ -z "${AWS_DEPLOY_ROLE_ARN}" ]]; then
            echo "AWS_DEPLOY_ROLE_ARN repository variable is required."
            exit 1
          fi

          if [[ -z "${AWS_REGION}" ]]; then
            echo "AWS_REGION repository variable is required."
            exit 1
          fi

          python3 - <<'PY' > md-commands.json
          import json

          commands = [
              "set -euo pipefail",
              "sudo -iu ec2-user bash -lc 'cd /home/ec2-user/Agent_Cluster_deploy_src && git pull --ff-only && rsync -a --delete /home/ec2-user/Agent_Cluster_deploy_src/deploy/agent_2_dashboard_adapter/ /home/ec2-user/agent_2_dashboard_adapter/'",
              "sudo systemctl restart agent2-dashboard-adapter",
              "sudo systemctl status agent2-dashboard-adapter --no-pager",
              "sudo bash -lc 'set -a; source /etc/gate-dashboard/agent2-dashboard-adapter.env; set +a; curl --fail --silent --show-error http://127.0.0.1:9011/health -H \"X-Dashboard-Secret: ${DASHBOARD_ADAPTER_SECRET}\"'"
          ]

          print(json.dumps({"commands": commands}))
          PY

          command_id="$(
            aws ssm send-command \
              --instance-ids "${AWS_MD_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Agent Cluster adapter to md" \
              --parameters file://md-commands.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "md command id: ${command_id}"

          for _ in {1..60}; do
            status="$(
              aws ssm get-command-invocation \
                --command-id "${command_id}" \
                --instance-id "${AWS_MD_INSTANCE_ID}" \
                --query "Status" \
                --output text
            )"

            echo "md status: ${status}"

            case "${status}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${AWS_MD_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${AWS_MD_INSTANCE_ID}" \
                  --query "{stdout: StandardOutputContent, stderr: StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for md deployment to finish."
          exit 1

  deploy-cio:
    name: Deploy cio
    runs-on: ubuntu-latest
    needs: deploy-md

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy dashboard to cio via SSM
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AWS_CIO_INSTANCE_ID}" ]]; then
            echo "AWS_CIO_INSTANCE_ID repository variable is required."
            exit 1
          fi

          python3 - <<'PY' > cio-commands.json
          import json

          commands = [
              "set -euo pipefail",
              "sudo -iu ec2-user bash -lc 'cd /home/ec2-user/Agent_Cluster_v2 && git pull --ff-only && source /home/ec2-user/.nvm/nvm.sh && pnpm install && pnpm build'",
              "sudo systemctl restart gate-dashboard",
              "sudo systemctl status gate-dashboard --no-pager",
              "curl --fail --silent --show-error http://127.0.0.1:3000/api/nodes",
              "curl --fail --silent --show-error http://127.0.0.1:3000/api/files"
          ]

          print(json.dumps({"commands": commands}))
          PY

          command_id="$(
            aws ssm send-command \
              --instance-ids "${AWS_CIO_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Agent Cluster dashboard to cio" \
              --parameters file://cio-commands.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "cio command id: ${command_id}"

          for _ in {1..60}; do
            status="$(
              aws ssm get-command-invocation \
                --command-id "${command_id}" \
                --instance-id "${AWS_CIO_INSTANCE_ID}" \
                --query "Status" \
                --output text
            )"

            echo "cio status: ${status}"

            case "${status}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${AWS_CIO_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${AWS_CIO_INSTANCE_ID}" \
                  --query "{stdout: StandardOutputContent, stderr: StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for cio deployment to finish."
          exit 1
